# ═══════════════════════════════════════════════════════════════
#  إعدادات الـ Worker
#
#  ⚠️ ما في ولا مفتاح سرّي بهذا الملف — وهاد مقصود.
#     الملف بينرفع على GitHub، والمفاتيح بتنحط من لوحة Cloudflare
#     أو بأمر wrangler secret put، وبتضل مخزّنة عندهم مشفّرة.
# ═══════════════════════════════════════════════════════════════

name = "ryanalali-api"
main = "src/index.js"
compatibility_date = "2026-07-30"

# ═══════════════════════════════════════════════════════════════
#  الكرونات — التقرير الصباحي + تنبيهات بلوكات الخطة (2026-08-08)
#
#  ⚠️ الأردن ألغى التوقيت الصيفي من ٢٠٢٢ — UTC+3 طول السنة.
#     يعني الحساب ثابت وما بيحتاج تعديل بالشتا.
#     (التعليق القديم كان بيقول «التوقيت الصيفي» وهاد ما عاد ينطبق.)
#
#  ⚠️ كلاودفلير بيسمح بخمس كرونات كحد أقصى للـ Worker الواحد.
#     ولهيك فلترة الجمعة صارت **بالكود** جوّا scheduled() مش بالكرون —
#     لو عملناها بالكرون كنا نحتاج ستة وما بيزبط.
#
#   0 5  = ٨:٠٠  ← التقرير الصباحي + تنبيه الصيد (أو رسالة الجمعة)
#   0 8  = ١١:٠٠ ← بلوك الوظائف
#   0 10 = ١٣:٠٠ ← بلوك المحتوى
#   0 18 = ٢١:٠٠ ← تقرير المسا + قراءة الأرقام
# ═══════════════════════════════════════════════════════════════
[triggers]
crons = ["0 5 * * *", "0 8 * * *", "0 10 * * *", "0 18 * * *"]

# مختبر الأفكار — موديلات Cloudflare نفسها، مجانية وبلا مفاتيح
[ai]
binding = "AI"

# ─── متغيّرات مش سرّية (بينفع تنكتب هون) ───
[vars]
# وين بدك توصلك الطلبات
MAIL_TO = "ryan.elwathiq@gmail.com"

# ═══════════════════════════════════════════════════════════════
#  مين المرسِل
#
#  الدومين hello.ryanalali.me موثّق عند Resend بأربع سجلات DNS
#  (DKIM + MX + SPF + DMARC) — 2026-08-02. وهذا اللي بيخلّي Gmail
#  يصدّق إنه الإيميل منك فعلاً بدل ما يرميه بالسبام.
#
#  ⚠️ ممنوع تكتب هون أي عنوان على دومين غير موثّق — Resend
#     بيرفض الإرسال بـ 403 والطلب بيضيع بصمت.
#  ⚠️ الاسم «Rayan Elwathiq» هو اللي بيشوفه العميل بصندوقه،
#     والعنوان ما بيبيّن إلا لو دقّق. عشان هيك الاسم مهم أكثر
#     من العنوان نفسه.
# ═══════════════════════════════════════════════════════════════
# ⚠️ تحديث 2026-08-08: كان `ryan@hello.ryanalali.me`.
#    السبب الأصلي للنطاق الفرعي كان الخوف إنه توثيق الجذر بـResend
#    بيكسر MX تبع Cloudflare Email Routing. **وهاد الخوف انتفى**:
#    Resend بيحط سجلاته على `send.` و`resend._domainkey.` — والجذر
#    ما بينلمس. (والشرط الوحيد: `Enable Receiving` بيضل مطفي عند
#    Resend، لأنه هو اللي بيطلب MX على الجذر ويكسر الاستقبال.)
#
#    والفايدة مش شكلية: صار العنوان الواحد `ryan@ryanalali.me` هو
#    اللي بيرسل منه الموقع، وهو اللي بيستقبل عليه ريّان، وهو اللي
#    بيرد منه يدوياً عبر Gmail Send-as. عنوان واحد بكل تواصل.
MAIL_FROM = "Rayan Elwathiq <ryan@ryanalali.me>"

# ═══════════════════════════════════════════════════════════════
#  لوين بيروح رد العميل لما يضغط Reply
#
#  انبدّل من جيميل لعنوان الدومين بعد ما شغّلنا Cloudflare Email
#  Routing (2026-08-02). العميل بيشوف عنوان على دومينك، وهاد
#  أوقع بكثير من عنوان جيميل بأول تواصل مع عميل جديد.
#
#  ⚠️ منفصل عن MAIL_TO عن قصد: MAIL_TO هو «وين بتوصلني الطلبات»
#     (صندوق شغّال ومضمون = جيميل)، و REPLY_TO هو «شو بيشوف
#     العميل». الرسالة اللي بتوصل ryan@ryanalali.me بتنوجّه
#     لجيميل عبر Email Routing، فبالنهاية كله بيوصل لنفس المكان
#     — بس الواجهة أنضف.
#  ⚠️ لو وقّفت Email Routing يوماً، رجّع هالسطر لجيميل فوراً وإلا
#     ردود العملاء بتضيع.
# ═══════════════════════════════════════════════════════════════
REPLY_TO = "ryan@ryanalali.me"

# رقم محادثة ريّان بتيليجرام — لوين بيروح تنبيه الطلبات.
# ⚠️ مش سرّي: هو معرّفك بتيليجرام وأي بوت بتحكي معه بيشوفه،
#    وما بيسمح لحدا يقرأ رسايلك ولا يبعت باسمك. السرّي هو
#    توكن البوت، وهو محطوط كـ secret مش هون.
TELEGRAM_CHAT_ID = "1778887119"

# ─── المفاتيح السرّية — بتنحط بأوامر منفصلة، مش هون ───
#   npx wrangler secret put RESEND_KEY
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID

# ═══════════════════════════════════════════════════════════════
#  قاعدة بيانات الطلبات
#
#  ليش؟ الإيميل وتيليجرام قنوات تنبيه مش أرشيف — الرسايل بتضيع
#  بالبحث وبتتحذف. هون كل طلب بينحفظ بصف كامل بتقدر تبحث فيه
#  وتصدّره وتشوف مين طلب شو ومتى.
#
#  ⚠️ هاي بيانات شخصية لعملاء (اسم، إيميل، تلفون، تفاصيل شغلهم).
#     محفوظة بحسابك أنت وما بتنشارك — وهاد اللي مكتوب بالفورم
#     نفسه: «ما بشارك تفاصيل مشروعك مع حدا».
# ═══════════════════════════════════════════════════════════════
[[d1_databases]]
binding = "LEADS"
database_name = "ryanalali-leads"
database_id = "5151af48-7fba-4771-8b2d-8997f04ef972"
